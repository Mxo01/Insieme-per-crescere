name: Deploy Portfolio to GitHub Pages

on:
    pull_request:
        types: [closed]
        paths:
            - 'portfolio/**'

permissions:
    contents: write

jobs:
    deploy_portfolio:
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.merged == true && github.ref == 'refs/heads/main' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'
                  cache-dependency-path: portfolio/package-lock.json

            - name: Install dependencies
              working-directory: portfolio
              run: npm ci

            - name: Build
              working-directory: portfolio
              run: npm run build -- --base-href /insieme-per-crescere/

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: portfolio/dist/portfolio/browser
                  destination_dir: .
                  keep_files: true
