<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Insieme per Crescere - Dashboard</title>
    <script>
      // SPA redirect for GitHub Pages — dashboard is always at /insieme-per-crescere/dashboard/
      // Based on https://github.com/rafgraph/spa-github-pages
      (function () {
        var segments = window.location.pathname.split("/").filter(Boolean);
        // Keep the first 2 segments: ['insieme-per-crescere', 'dashboard']
        var segmentsToKeep = 2;
        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.host +
            "/" +
            segments.slice(0, segmentsToKeep).join("/") +
            "/?/" +
            segments
              .slice(segmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search
              ? "&" + l.search.slice(1).replace(/&/g, "~and~")
              : "") +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
